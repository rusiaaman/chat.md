[project]
name = "chatmd"
version = "0.7.0"
description = "Engine and CLI for .chat.md files — a plain-text chat interface to any LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aman Rusia" }]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.60",
    "mcp>=1.9",
    "watchfiles>=0.24",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
chatmd = "chatmd.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options and arguments as call expressions in parameter
# defaults; that is the framework's API, not an accident.
"src/chatmd/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/chatmd"]
ignore_missing_imports = true
